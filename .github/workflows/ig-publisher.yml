# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches:
      - '**'
      # Dependabot branches build through their PR instead (see the job
      # condition below), which keeps a bot branch from publishing a Pages
      # preview that nobody asked for.
      - '!dependabot/**'
      - '!gh-pages'
  pull_request:
  # Publishing a GitHub release builds that tag and promotes it to the site
  # root. The tag must match the version in sushi-config.yaml.
  release:
    types: [published]

permissions:
  contents: write
  # PR comments go through the issues API, hence both scopes.
  issues: write
  pull-requests: write

jobs:

  build:
    runs-on: ubuntu-latest
    # A branch in this repo already builds on its push event, so the PR run
    # would be a second build of the same commit. Two kinds of PR have no push
    # event to rely on: those from forks, and Dependabot's, whose branches are
    # excluded from the push trigger above. Without the last clause a
    # Dependabot PR would build nowhere at all and merge unverified.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      startsWith(github.head_ref, 'dependabot/')
    # An IG build that hangs would otherwise sit in the default 6h timeout and,
    # through the shared concurrency group, block every other publish.
    timeout-minutes: 45
    # Publishing force-pushes gh-pages, so two publishing runs must not overlap:
    # the later push would silently drop the other run's directory. Shared with
    # pages-cleanup.yml. Runs that only build (pull_request) are grouped per ref
    # and stay parallel.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ig-build-{0}', github.ref) || 'gh-pages-publish' }}
      cancel-in-progress: false
    container:
      image: ghcr.io/gefyra/ig-publisher:latest
    env:
      INPUT_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fail before the (slow) build rather than after, and never publish an IG
      # under a version number it does not actually carry.
      - name: Resolve release version
        id: release
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          configured="$(awk '/^version:/ {print $2; exit}' sushi-config.yaml)"
          if [ "${version}" != "${configured}" ]; then
            echo "Release tag '${TAG}' resolves to version ${version}," >&2
            echo "but sushi-config.yaml declares ${configured}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Run SUSHI (FSH -> FHIR conversion) on Resources directory
      - name: Run SUSHI
        shell: bash
        run: |
          set -euo pipefail
          sushi ${{ env.INPUT_DIR }}


      - name: Build hierarchical IG
        shell: bash
        run: |
          set -euo pipefail
          igpublisher -ig ${{ env.INPUT_DIR }} -no-sushi
          mkdir -p .tmp/kdl-hierarchical
          cp output/CodeSystem-kdl.html .tmp/kdl-hierarchical/CodeSystem-kdl.html

      - name: Flatten KDL CodeSystem JSON
        shell: bash
        run: |
          set -euo pipefail
          node scripts/flatten-codesystem.js \
            fsh-generated/resources/CodeSystem-kdl.json \
            fsh-generated/resources/CodeSystem-kdl.json
          if [ ! -f fsh-generated/resources/CodeSystem-kdl.json ]; then
            echo "Expected flattened CodeSystem JSON was not generated"
            exit 1
          fi

      - name: Build flat IG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output
          igpublisher -ig ${{ env.INPUT_DIR }} -no-sushi

      - name: Restore hierarchical CodeSystem HTML page
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp/kdl-hierarchical/CodeSystem-kdl.html output/CodeSystem-kdl.html
          if [ ! -f output/CodeSystem-kdl.html ]; then
            echo "Expected CodeSystem-kdl.html was not restored"
            exit 1
          fi

      # Uploaded before the QA gate, so a failing build still leaves qa.html
      # behind to look at.
      - name: Upload Build Results
        uses: actions/upload-artifact@v6
        with:
          name: fhir-ig
          path: |
            ${{ env.INPUT_DIR }}/output
          retention-days: 14

      # The publisher reports validation results in qa.xml instead of through
      # its exit code, so nothing fails on errors unless we look ourselves.
      # The renderer turns those issues into inline annotations and a summary
      # table, and fails the job if any error survives the filters below.
      - name: Check IG validation results
        uses: patrick-werner/validation-outcome-markdown-renderer@v1
        with:
          # qa.xml is the publisher's own OperationOutcome bundle; the renderer
          # detects XML from the content, so it is consumed as-is.
          bundle-file: ${{ env.INPUT_DIR }}/output/qa.xml
          # Warnings are annotated for visibility but do not fail the build --
          # only errors do. Warnings meant to stay are silenced in
          # input/ignoreWarnings.txt, which the publisher applies before this.
          include: warnings
          # Written even when the step fails, so the PR comment below can
          # report the errors that caused the failure. Kept explicit because
          # that step reads the very same path.
          pr-summary-path: pr-summary.md

      # Mark repository as safe to avoid dubious ownership warnings
      - name: Mark repository as safe
        if: github.event_name != 'pull_request'
        run: git config --global --add safe.directory ${{ github.workspace }}

      # Publish the IG output to a branch-specific preview directory
      - name: Publish branch preview to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ env.INPUT_DIR }}/output
        run: scripts/gh-pages.sh publish-preview "${GITHUB_REF_NAME}"

      # Promote a published release to the site root and archive it by version
      - name: Publish release to GitHub Pages
        if: github.event_name == 'release'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ env.INPUT_DIR }}/output
        run: scripts/gh-pages.sh publish-release "${{ steps.release.outputs.version }}"

      - name: Announce published URL
        id: announce_url
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            label="release ${RELEASE_VERSION}"
            url="${site}/"
          else
            label="branch ${GITHUB_REF_NAME}"
            url="${site}/branches/${GITHUB_REF_NAME}/"
          fi
          echo "Published to ${url}"
          printf '### Deployment\n[Open published IG for %s](%s)\n' "${label}" "${url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published_url=${url}" >> "${GITHUB_OUTPUT}"

      # Repo-internal PRs are built by their branch's push event, not by the
      # pull_request event, so the PR feedback has to be posted from here.
      # Runs even when validation failed -- that is when the report matters
      # most -- but not when the job was cancelled.
      - name: Upsert PR comment with build results
        if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PUBLISHED_URL: ${{ steps.announce_url.outputs.published_url }}
          # Written by the validation step above.
          SUMMARY_PATH: pr-summary.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = '<!-- ig-publish-url -->';
            const url = process.env.PUBLISHED_URL;
            const runUrl = process.env.RUN_URL;

            // The renderer writes the same markdown it puts in the job summary.
            // Absent means the build died before validation ran.
            let validation = '';
            try {
              validation = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8').trim();
            } catch {
              core.info('No validation summary found; reporting the deployment only.');
            }

            // Comments are capped at 65536 characters, and a run with many
            // findings can exceed that. Keep room for the deployment section.
            const limit = 60000;
            if (validation.length > limit) {
              validation = validation.slice(0, limit) +
                `\n\n_Truncated — see the [full validation summary](${runUrl})._`;
            }

            const deployment = url
              ? `[Open published IG for branch \`${branch}\`](${url})`
              : `Not published — see the [workflow run](${runUrl}).`;

            if (!validation && !url) {
              core.info('Neither a validation summary nor a published URL; skipping PR comment.');
              return;
            }

            const body = [marker, validation, '### Deployment', deployment]
              .filter(Boolean).join('\n\n');

            // Try to find an open PR for this branch. Filtering by head server
            // side keeps this to one short page no matter how many PRs are open.
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }

            // Paginated on purpose: the marker comment is the oldest one on the
            // PR, so on a busy PR it sits past the first page. Missing it would
            // post a duplicate instead of updating the existing comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });

            // Find existing marker comment (any author)
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated build results comment on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
              core.info(`Created build results comment on PR #${pr.number}`);
            }
